name: in_sight
description: In-Sight — AI companion for introverts. 3 personas, privacy-first.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # HTTP & Streaming (SSE handled manually via http stream)
  http: ^1.2.1

  # Navigation
  go_router: ^14.6.3

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_markdown_plus: ^1.0.7
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.1
  crypto: ^3.0.3
  package_info_plus: ^8.1.3
  connectivity_plus: ^6.1.4

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  # assets và fonts sẽ thêm sau khi có file thực tế
  # assets:
  #   - assets/images/
  # fonts: (dùng google_fonts thay thế)
