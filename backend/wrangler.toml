name            = "in-sight-api"
main            = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ──────────────────────────────────────────────────────────────
# Non-secret runtime config (safe to commit)
# ──────────────────────────────────────────────────────────────
[vars]
APP_VERSION = "1.0.0"

# ──────────────────────────────────────────────────────────────
# Secrets — set these via CLI, NEVER commit real values here
#
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put APP_KEY
#   wrangler secret put BIO_LAY
#   wrangler secret put BIO_MENTOR
#   wrangler secret put BIO_SOUL
#
# For local dev: copy .dev.vars.example → .dev.vars and fill in values.
# ──────────────────────────────────────────────────────────────
